
name: Build TanzimsOraNow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f TanzimsOraNow/gradlew ]; then
            cd TanzimsOraNow
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TanzimsOraNow-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            TanzimsOraNow/app/build/outputs/apk/debug/app-debug.apk
